[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datasheet-studio"
version = "0.2.0"
description = "A specialized desktop application for reading, organizing, annotating, and analyzing electronic-component datasheets."
readme = "docs/PROJECT_OVERVIEW.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6==6.11.1",
    "PyMuPDF==1.28.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
build = [
    "Nuitka==4.1.1",
]

[project.scripts]
datasheet-studio = "datasheet_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyside6-project]
